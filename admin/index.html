<!doctype html>
<html lang="de" data-theme="dark">
<head>

  <title>Bearbeiten — Louis Koller</title>
  <meta name="robots" content="noindex, nofollow">

<body>
  <header class="bar">
    <a class="bar__back" href="/">← Seite</a>

    <button class="btn btn--accent" type="button" data-publish disabled>Veröffentlichen</button>

  <nav class="tabs" data-tabs hidden>

    <div class="sheet__box" data-sheet-box></div>

  <input type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple hidden data-pick-photos>
  <input type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.m4v,.webm" hidden data-pick-video>
  <input type="file" accept="image/*" hidden data-pick-poster>

  <script src="/admin/admin.js?v=1"></script>
