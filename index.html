<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Louis Koller — Photography &amp; Film</title>
  <meta name="description" content="Louis Koller — photographer and cinematographer. Selected photographs and film stills.">
  <meta name="theme-color" content="#0d0c0a">
  <meta property="og:title" content="Louis Koller — Photography &amp; Film">
  <meta property="og:description" content="Selected photographs and film stills.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.louiskoller.cc/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0c0a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff3b1f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    try { var t = localStorage.getItem("lk-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    document.documentElement.classList.add("js");
  </script>
</head>
<body>
  <a class="skip" href="#photographs">Skip to work</a>

  <!-- Intro: "developing" -->
  <div class="loader" aria-hidden="true">
    <div class="loader__row">
      <span class="loader__dot"></span>
      <span>Developing</span>
      <span class="loader__count">000</span>
    </div>
  </div>

  <header class="nav">
    <a class="nav__name" href="#top" data-name></a>
    <nav class="nav__links" aria-label="Sections">
      <a href="#photographs">Photographs<sup>01</sup></a>
      <a href="#stills">Stills<sup>02</sup></a>
      <a href="#info">Info<sup>03</sup></a>
    </nav>
    <div class="nav__right">
      <span class="nav__clock" data-clock></span>
      <button class="nav__theme" type="button" data-theme-toggle aria-label="Toggle light table mode">
        <span class="nav__theme-dot"></span><span data-theme-label>Light table</span>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <div class="hero__meta">
        <span>Portfolio <span data-year></span></span>
        <span data-role></span>
        <span data-coords></span>
        <span class="hero__meta-r" data-location></span>
      </div>

      <h1 class="hero__name">
        <span class="hero__line hero__line--1">
          <span class="hero__word" data-first></span>
          <span class="hero__frame" data-hero-frame data-cursor="View">
            <img alt="" data-hero-a>
            <img alt="" data-hero-b>
          </span>
        </span>
        <span class="hero__line hero__line--2">
          <em class="hero__word" data-last></em>
        </span>
      </h1>

      <div class="hero__foot">
        <a href="#photographs" class="hero__scroll">Scroll <span aria-hidden="true">↓</span></a>
        <span class="hero__caption" data-hero-caption></span>
      </div>
    </section>

    <!-- 01 Photographs -->
    <section class="section" id="photographs">
      <div class="section-head">
        <span class="section-head__num">(01)</span>
        <h2 class="section-head__title">Photo&shy;graphs</h2>
        <div class="section-head__side">
          <span data-photo-count></span>
          <div class="view-toggle" role="group" aria-label="View">
            <button type="button" data-view="grid" aria-pressed="true">Grid</button>
            <button type="button" data-view="index" aria-pressed="false">Index</button>
          </div>
        </div>
      </div>

      <div class="grid" data-grid></div>
      <div class="index" data-index hidden>
        <div class="index__head" aria-hidden="true">
          <span>No.</span><span>Title</span><span>Place</span><span>Camera</span><span>Year</span>
        </div>
        <ol class="index__list" data-index-list></ol>
      </div>
    </section>

    <!-- 02 Stills -->
    <section class="stills" id="stills" data-stills>
      <div class="stills__sticky">
        <div class="section-head section-head--stills">
          <span class="section-head__num">(02)</span>
          <h2 class="section-head__title">Film <em>Stills</em></h2>
          <div class="section-head__side">
            <span data-reel>Reel 01</span>
          </div>
        </div>
        <div class="stills__viewport">
          <div class="stills__track" data-track></div>
        </div>
        <div class="stills__progress"><span data-progress></span></div>
      </div>
    </section>

    <!-- 03 Info -->
    <section class="section info" id="info">
      <div class="section-head">
        <span class="section-head__num">(03)</span>
        <h2 class="section-head__title">Info</h2>
      </div>
      <div class="info__body">
        <p class="info__statement" data-statement></p>
        <div class="info__text" data-about></div>
        <div class="info__details" data-details></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a class="marquee" data-mail aria-label="Send an email">
      <span class="marquee__track" data-marquee></span>
    </a>
    <div class="footer__row">
      <span>© <span data-year></span> <span data-fullname></span></span>
      <span class="footer__links" data-links></span>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lb" role="dialog" aria-modal="true" aria-label="Image viewer" data-lb hidden>
    <div class="lb__top">
      <span data-lb-count></span>
      <button type="button" class="lb__close" data-lb-close>Close <span aria-hidden="true">✕</span></button>
    </div>
    <div class="lb__stage">
      <img alt="" data-lb-img>
      <button type="button" class="lb__hit lb__hit--prev" data-lb-prev data-cursor="Prev" aria-label="Previous image"></button>
      <button type="button" class="lb__hit lb__hit--next" data-lb-next data-cursor="Next" aria-label="Next image"></button>
    </div>
    <div class="lb__bottom">
      <span class="lb__title" data-lb-title></span>
      <span class="lb__meta" data-lb-meta></span>
    </div>
  </div>

  <div class="preview" aria-hidden="true"><img alt="" data-preview-img></div>
  <div class="cursor" aria-hidden="true"><span data-cursor-label></span></div>

  <noscript><p class="noscript">This portfolio needs JavaScript to show the pictures.</p></noscript>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
