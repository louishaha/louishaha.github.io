<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Louis Koller — Photography</title>
  <meta name="description" content="Louis Koller — photographer. Landscape, wildlife and city photographs.">
  <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Louis Koller — Photography">
  <meta property="og:image" content="https://www.louiskoller.cc/images/thumbs/01-into-the-fog.jpg">
  <meta property="og:description" content="Landscape, wildlife and city photographs.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.louiskoller.cc/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111110'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='%23f3f1ec' text-anchor='middle'%3ELK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip" href="#work">Skip to work</a>

  <header class="nav">
    <a class="nav__name" href="#top" data-fullname></a>
    <nav class="nav__links" aria-label="Sections">
      <a href="#work">Work</a>
      <a href="#films" data-films-link hidden>Films</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <h1 class="hero__name" data-fit data-name></h1>

      <figure class="feature" data-feature>
        <button class="feature__frame" type="button" data-feature-open aria-label="Open photo">
          <img alt="" data-feature-a>
          <img alt="" data-feature-b>
        </button>
        <figcaption class="feature__cap">
          <span data-feature-title></span>
          <span class="feature__dots" data-feature-dots></span>
        </figcaption>
      </figure>

      <div class="hero__intro">
        <p class="hero__role"><span data-role></span><br><span class="muted" data-subjects></span></p>
        <p class="hero__statement" data-statement></p>
        <a class="hero__cta" href="#work">View work <span aria-hidden="true">↓</span></a>
      </div>

    </section>

    <!-- Work -->
    <section class="section" id="work">
      <div class="section__head">
        <h2 class="section__title">Work</h2>
        <span class="section__count" data-photo-count></span>
      </div>
      <div class="gallery" data-gallery></div>
    </section>

    <!-- Films (only shown if content.js has films) -->
    <section class="section" id="films" data-films hidden>
      <div class="section__head">
        <h2 class="section__title">Films</h2>
      </div>
      <div class="films" data-films-list></div>
    </section>

    <!-- About -->
    <section class="section about" id="about">
      <div class="section__head">
        <h2 class="section__title">About</h2>
      </div>
      <div class="about__body">
        <div class="about__text" data-about></div>
        <dl class="about__details" data-details></dl>
      </div>
    </section>
  </main>

  <!-- Contact -->
  <footer class="contact" id="contact">
    <p class="contact__label">Get in touch</p>
    <a class="contact__mail" data-mail data-fit></a>
    <div class="contact__row">
      <span>© <span data-year></span> <span data-fullname></span></span>
      <span class="contact__links" data-links></span>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lb" role="dialog" aria-modal="true" aria-label="Image viewer" data-lb hidden>
    <div class="lb__top">
      <span data-lb-count></span>
      <button type="button" class="lb__btn" data-lb-close>Close ✕</button>
    </div>
    <div class="lb__stage" data-lb-stage>
      <img alt="" data-lb-img>
    </div>
    <div class="lb__bottom">
      <button type="button" class="lb__btn" data-lb-prev aria-label="Previous image">← Prev</button>
      <span class="lb__info"><b data-lb-title></b> <span class="muted" data-lb-meta></span></span>
      <button type="button" class="lb__btn" data-lb-next aria-label="Next image">Next →</button>
    </div>
  </div>

  <noscript><p class="noscript">This portfolio needs JavaScript to show the pictures.</p></noscript>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
