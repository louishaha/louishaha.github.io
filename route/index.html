<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gapyear — Louis Koller</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff453a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/maplibre-gl.css?v=5.24.0">
  <link rel="stylesheet" href="route.css?v=4">
  <script>
    try { if (localStorage.getItem("lk-route-key") === "c07e31de") document.documentElement.classList.add("unlocked"); } catch (e) {}
  </script>
</head>
<body>
  <div class="gate" data-gate>
    <div class="gate__box">
      <svg class="gate__lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
      <h1 class="gate__title">Gap<em>year</em></h1>
      <p class="gate__sub">Code eingeben</p>
      <div class="code" role="group" aria-label="Code eingeben">
        <input class="code__input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" aria-label="Vierstelliger Code">
        <span class="code__slot"></span><span class="code__slot"></span><span class="code__slot"></span><span class="code__slot"></span>
      </div>
      <p class="gate__hint" data-gate-hint aria-live="polite"></p>
      <a class="gate__back" href="/">Zurück zur Startseite</a>
    </div>
  </div>

  <div class="map" id="map" aria-label="Karte der Reiseroute"></div>

  <header class="top">
    <a class="chip" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>Louis Koller</a>
    <button class="chip" type="button" data-live hidden><span class="chip__dot"></span><span data-live-label></span></button>
    <a class="chip" href="admin.html" data-admin-link hidden>Bearbeiten</a>
  </header>

  <aside class="panel" data-panel aria-label="Reise">
    <div class="panel__handle" data-handle><span></span></div>
    <div class="panel__head" data-head>
      <p class="eyebrow" data-sub>Route &amp; Journal</p>
      <h1 class="panel__title" data-title>Gap<em>year</em></h1>
      <div class="stats" data-stats></div>
    </div>
    <nav class="tabs" aria-label="Ansicht">
      <div class="seg" data-seg>
        <span class="seg__thumb" data-seg-thumb aria-hidden="true"></span>
        <button class="tab" type="button" data-tab="journal">Journal<sup data-n-posts></sup></button>
        <button class="tab" type="button" data-tab="orte">Orte<sup data-n-stops></sup></button>
      </div>
      <span class="tabs__spacer"></span>
      <button class="tabs__sort" type="button" data-sort hidden></button>
    </nav>
    <div class="panel__body" data-body></div>
  </aside>

  <div class="lb" data-lb hidden role="dialog" aria-modal="true" aria-label="Medien">
    <div class="lb__top">
      <span></span>
      <span data-lb-count></span>
      <button class="lb__close" type="button" data-lb-close aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="lb__stage" data-lb-stage>
      <div class="lb__media" data-lb-media></div>
      <button class="lb__nav lb__nav--prev" type="button" data-lb-prev aria-label="Vorheriges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
      <button class="lb__nav lb__nav--next" type="button" data-lb-next aria-label="Nächstes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
    </div>
    <div class="lb__bottom" data-lb-cap></div>
  </div>

  <script src="vendor/maplibre-gl.js?v=5.24.0"></script>
  <script src="common.js?v=4"></script>
  <script src="viewer.js?v=4"></script>
</body>
</html>
