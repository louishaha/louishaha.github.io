<body>
  <div class="gate" data-gate>
    <div class="gate__box">
      <svg class="gate__lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
      <h1 class="gate__title">Gap<em>year</em></h1>
      <p class="gate__sub">Code eingeben</p>
      <div class="code" role="group" aria-label="Code eingeben">
        <input class="code__input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" aria-label="Vierstelliger Code">
        <span class="code__slot"></span><span class="code__slot"></span><span class="code__slot"></span><span class="code__slot"></span>
      </div>
      <p class="gate__hint" data-gate-hint aria-live="polite"></p>
      <a class="gate__back" href="/">Zur Startseite</a>
    </div>
  </div>

  <div class="adm">
    <header class="adm__bar">
      <a class="chip" href="./"><svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Ansicht</a>
      <span class="adm__status" data-status data-kind="" aria-live="polite">Lade …</span>
      <button class="btn btn--accent" type="button" data-publish disabled>Veröffentlichen</button>
    </header>
    <div class="adm__main">
      <section class="adm__side">
        <nav class="tabs" aria-label="Bereiche" data-tabs hidden>
          <div class="seg" style="--n:4">
            <button class="tab" type="button" data-tab="orte">Orte</button>
            <button class="tab" type="button" data-tab="posts">Beiträge</button>
            <button class="tab" type="button" data-tab="here">Standort</button>
            <button class="tab" type="button" data-tab="general">Allgemein</button>
          </div>
        </nav>
        <div data-pane></div>
      </section>
      <div class="adm__map">
        <div class="map" id="map"></div>
        <span class="chip adm__pick" data-pick-hint hidden>Tippe auf die Karte oder ziehe den Marker</span>
      </div>
    </div>
  </div>

  <script src="vendor/maplibre-gl.js?v=5.24.0"></script>
  <script src="common.js?v=3"></script>
  <script src="admin.js?v=3"></script>
